name: Verify Cloudflare production build

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout production source
        uses: actions/checkout@v4
      - name: Use Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Validate generated pages (Cloudflare command, stage 1)
        run: node build.mjs --check
      - name: Build Cloudflare Pages output (stage 2)
        run: PORTFOLIO_SITE_URL=https://amiraabdelfadil.pages.dev/ node pages.mjs
      - name: Verify staff-only educational application in production bundle
        run: |
          test -f dist/the-process/index.html
          test -f dist/the-process/education.js
          test -f dist/the-process/education.css
          test -f dist/education-studio.html
          test -f dist/education-core.js
          test -f dist/education-studio.js
          grep -q 'Private educational workspace' dist/the-process/index.html
          grep -q 'education-studio.html' dist/editorial.html
          grep -q 'education-studio.html' dist/ar/editorial.html
          grep -q 'the-process' dist/_headers
          ! grep -q 'id="student-auth"' dist/the-process/index.html

      - name: Verify site-owned bilingual Field Notes subscriptions
        run: |
          test -f dist/field-notes-native.css
          test -f dist/field-notes-native.js
          test -f dist/field-notes-admin.js
          test -f dist/field-notes-admin.css
          test -f supabase/functions/subscribe-field-notes/index.ts
          node --check dist/field-notes-native.js
          node --input-type=module --check < dist/field-notes-admin.js
          grep -q 'data-field-notes-form' dist/notes.html
          grep -q 'data-field-notes-form' dist/ar/notes.html
          grep -q 'data-field-notes-form' dist/responsive.html
          grep -q 'data-field-notes-form' dist/ar/responsive.html
          grep -q 'data-field-notes-admin' dist/editorial.html
          grep -q 'data-field-notes-admin' dist/ar/editorial.html
          grep -q 'field-notes-native.js?v=1' dist/notes.html
          grep -q 'field-notes-native.js?v=1' dist/ar/notes.html
          ! grep -q 'subscribe-forms.beehiiv.com' dist/notes.html
          ! grep -q 'subscribe-forms.beehiiv.com' dist/ar/notes.html
          ! grep -q 'subscribe-forms.beehiiv.com' dist/responsive.html
          ! grep -q 'subscribe-forms.beehiiv.com' dist/ar/responsive.html
          ! grep -q 'amiras-newsletter-beec8a' dist/notes.html
          ! grep -q 'amiras-newsletter-beec8a' dist/ar/notes.html
      - name: Reject homepage gaps and padded new uploads
        run: |
          node --check dist/homepage-photo-guard.mjs
          node --test tests/homepage-mosaic.test.mjs
          grep -q 'max-height:min(52dvh,410px)' dist/education-announcement.css
          grep -q 'navigator.standalone === true' dist/theme-init.js
          grep -q 'html.amira-ios-homeapp .home-topbar' dist/homepage-mosaic-integrity.css
          grep -q 'theme-init.js?v=4' dist/index.html
          grep -q 'theme-init.js?v=4' dist/ar/responsive.html
          grep -q -- '--amira-standalone-top:max(52px' dist/homepage-mosaic-integrity.css
          grep -q 'homepage-mosaic-integrity.css?v=20261121iosstandalone3' dist/index.html
          grep -q 'homepage-mosaic-integrity.css?v=20261121iosstandalone3' dist/responsive.html
          grep -q 'homepage-mosaic-integrity.css?v=20261121iosstandalone3' dist/ar/current.html
          grep -q 'homepage-mosaic-integrity.css?v=20261121iosstandalone3' dist/ar/responsive.html
      - name: Verify stable bilingual full-viewport homepage headers in production output
        run: |
          test -f dist/home-header-unified.css
          test -f dist/responsive.html
          test -f dist/ar/current.html
          test -f dist/ar/responsive.html
          grep -q 'height:100dvh' dist/home-minimal.css
          grep -q 'position:fixed' dist/home-header-unified.css
          grep -q 'home-minimal.js?v=20261121about' dist/index.html
          grep -q 'is-after-hero' dist/home-minimal.js
          grep -q 'home-header-unified.css?v=2' dist/index.html
          grep -q 'home-header-unified.css?v=2' dist/responsive.html
          grep -q 'home-header-unified.css?v=2' dist/ar/current.html
          grep -q 'home-header-unified.css?v=2' dist/ar/responsive.html
          grep -q 'class="home-topbar"' dist/index.html
          grep -q 'class="home-topbar"' dist/responsive.html
          grep -q 'class="home-topbar"' dist/ar/current.html
          grep -q 'class="home-topbar"' dist/ar/responsive.html
          ! grep -q 'site-header.css?v=' dist/index.html
          ! grep -q 'site-header.css?v=' dist/responsive.html
          ! grep -q 'site-header.css?v=' dist/ar/current.html
          ! grep -q 'site-header.css?v=' dist/ar/responsive.html
          grep -q 'site-design-router.js?v=4' dist/index.html
          grep -q 'site-design-router.js?v=4' dist/responsive.html
          grep -q 'site-design-router.js?v=4' dist/ar/responsive.html
          grep -q 'const normalized=p=>' dist/site-design-router.js
          grep -q 'amira-design-routing' dist/theme-init.js
