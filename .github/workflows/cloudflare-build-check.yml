name: Verify Cloudflare production build

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout production source
        uses: actions/checkout@v4
      - name: Use Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Validate generated pages (Cloudflare command, stage 1)
        run: node build.mjs --check
      - name: Build Cloudflare Pages output (stage 2)
        run: PORTFOLIO_SITE_URL=https://amiraabdelfadil.pages.dev/ node pages.mjs
      - name: Verify privacy, bilingual legal notices, and browser protection
        run: |
          node --check privacy-controls.js
          node --check theme.js
          node --check pages.mjs
          node --test tests/legal-privacy.test.mjs
      - name: Verify staff-only educational application in production bundle
        run: |
          test -f dist/the-process/index.html
          test -f dist/the-process/education.js
          test -f dist/the-process/education.css
          test -f dist/education-studio.html
          test -f dist/education-core.js
          test -f dist/education-studio.js
          grep -q 'PRIVATE BY INVITATION' dist/the-process/index.html
          grep -q 'education-studio.html' dist/editorial.html
          grep -q 'education-studio.html' dist/ar/editorial.html
          grep -q 'the-process' dist/_headers
          ! grep -q 'id="student-auth"' dist/the-process/index.html

      - name: Verify site-owned bilingual Notebook subscriptions
        run: |
          test -f dist/field-notes-native.css
          test -f dist/field-notes-native.js
          test -f dist/field-notes-admin.js
          test -f dist/field-notes-admin.css
          test -f supabase/functions/subscribe-field-notes/index.ts
          node --check dist/field-notes-native.js
          node --input-type=module --check < dist/field-notes-admin.js
          grep -q 'data-field-notes-form' dist/notes.html
          grep -q 'data-field-notes-form' dist/ar/notes.html
          grep -q 'data-field-notes-admin' dist/editorial.html
          grep -q 'data-field-notes-admin' dist/ar/editorial.html
          grep -q 'field-notes-native.js?v=1' dist/notes.html
          grep -q 'field-notes-native.js?v=1' dist/ar/notes.html
          test -f dist/responsive.html
          test -f dist/ar/responsive.html
          grep -q 'location.replace' dist/responsive.html
          grep -q 'location.replace' dist/ar/responsive.html
          ! grep -q 'subscribe-forms.beehiiv.com' dist/notes.html
          ! grep -q 'subscribe-forms.beehiiv.com' dist/ar/notes.html
          ! grep -q 'amiras-newsletter-beec8a' dist/notes.html
          ! grep -q 'amiras-newsletter-beec8a' dist/ar/notes.html
      - name: Verify the canonical classic homepage, film popups and preserved original photos
        run: |
          node --check dist/home.js
          node --check dist/site-refinement.js
          node --check pages.mjs
          grep -q 'classic-site-header' dist/index.html
          grep -q 'class="hero-media"' dist/index.html
          grep -q 'data-project="sweet-and-salty"' dist/index.html
          grep -q 'data-project="double-edged-sword"' dist/index.html
          grep -q 'class="project-dialog"' dist/index.html
          grep -q 'assets/mamina-02.jpg' dist/index.html
          ! grep -q 'photo-mosaic' dist/index.html
          test -f dist/assets/photography/italy/01.jpg
          test -f dist/assets/photography/alexandria/01.jpg
          test -f dist/assets/photography/zamalek/01.jpg
          test -f dist/assets/photography/west-el-balad/01.jpg
          test -f dist/assets/photography/between-stone-and-sea/01.jpg
          test -f dist/italy.html
          test -f dist/alexandria.html
          test -f dist/west-el-balad.html
          test -f dist/zamalek.html
          test -f dist/between-stone-and-sea.html
          grep -q 'collab-poster-grid' dist/collaborations.html
          grep -q 'site-refinement.js' dist/collaborations.html
          test -f dist/screenings.html
          test -f dist/awards.html
          test -f dist/endorsements.html
          grep -q 'amira-more-menu' dist/films.html
          grep -q 'amira-more-menu' dist/art.html
          grep -q 'amira-more-menu' dist/writing.html
          grep -q 'amira-more-menu' dist/collaborations.html
          grep -q 'amira-more-menu' dist/screenings.html
          grep -q 'amira-more-menu' dist/awards.html
          grep -q 'amira-more-menu' dist/endorsements.html
          grep -q 'amira-more-menu' dist/ar/awards.html
          grep -q 'menu-mobile-only' dist/index.html
          grep -q 'Date to be verified' dist/awards.html
          grep -q 'التاريخ قيد التحقق' dist/ar/awards.html
          grep -q 'A collection of:' dist/writing.html
          grep -q 'data-tally-form=' dist/notes.html
