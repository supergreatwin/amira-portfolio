name: ChatGPT & Codex Plugin Autopilot

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  analyze:
    name: Analyze repository for plugin workflows
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: ChatGPT & Codex Plugin Autopilot
        uses: imMamdouhaboammar/chatgpt-codex-plugin-autopilot@v0.8.0
        with:
          path: '.'
          action: 'analyze'
          create-pr: 'false'
          summary: 'true'
