name: Publish Amira to Cloudflare

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: amira-cloudflare-production-publish
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout current main
        uses: actions/checkout@v4
      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Validate the existing site
        run: node build.mjs --check
      - name: Produce the Cloudflare Pages distribution
        run: PORTFOLIO_SITE_URL=https://amiraabdelfadil.pages.dev/ node pages.mjs
      - name: Validate the approved classic homepage and original photography collections
        run: |
          node --check pages.mjs
          node --check dist/approved-classic.js
          node --test tests/legal-privacy.test.mjs tests/approved-classic.test.mjs tests/handover.test.mjs
          grep -q 'classic-site-header' dist/index.html
          ! grep -q 'photo-mosaic' dist/index.html
          test -f dist/assets/photography/italy/01.jpg
          test -f dist/assets/photography/alexandria/01.jpg
          test -f dist/assets/photography/zamalek/01.jpg
          test -f dist/assets/photography/west-el-balad/01.jpg
          test -f dist/assets/photography/between-stone-and-sea/01.jpg
      - name: Deploy to existing Cloudflare Pages project if authorized
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN || secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: d610c41ba30796b2e67943f5635eeddc
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "Cloudflare credentials not configured as CLOUDFLARE_API_TOKEN or CF_API_TOKEN."
            echo "No direct deploy attempted; existing Git integration remains unchanged."
            exit 1
          fi
          npx --yes wrangler@4 pages deploy dist --project-name=amiraabdelfadil --branch=main
