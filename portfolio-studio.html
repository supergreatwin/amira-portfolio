<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow,noarchive"><title>Portfolio Management | Editorial Desk</title><link rel="stylesheet" href="editorial.css"><link rel="stylesheet" href="content-studio.css"><style>.portfolio-date{font-size:.85rem;opacity:.8}.portfolio-filter{margin:1rem 0}.portfolio-preview{white-space:pre-wrap;overflow-wrap:anywhere}.ed-field textarea{width:100%} [hidden]{display:none!important}</style></head><body><main class="ed-width"><section class="ed-hero"><p class="ed-eyebrow">Amira Abdelfadil / Editorial Desk</p><h1>Portfolio Management.</h1><p class="ed-description">Dates, exhibitions, awards and endorsements.</p><a class="ed-button alt" href="editorial.html">← Editorial Desk</a></section><section id="locked" class="ed-panel"><p>Sign in with an approved administrator or editor account.</p></section><p id="portfolio-status" role="status" aria-live="polite"></p><section id="workspace" hidden class="ed-panel"><div class="cms-nav"><button type="button" id="dates-tab" class="active">Dates &amp; Timeline</button><button type="button" id="new-tab">New portfolio entry</button></div><div class="cms-work"><aside class="cms-aside"><h2>Portfolio records</h2><p id="counts"></p><div class="ed-field"><label for="filter">Filter records</label><select id="filter"><option value="all">All records</option><option value="pending">Pending dates</option><option value="confirmed">Confirmed dates</option><option value="exhibition">Exhibitions</option><option value="screening">Screenings</option><option value="selection">Festival selections</option><option value="award">Awards</option><option value="endorsement">Endorsements</option></select></div><div id="records" class="cms-records"></div></aside><div class="cms-editor"><form id="portfolio-form"><h2 id="form-title">Edit date</h2><p id="original"></p><div id="entry-fields"><div class="ed-field"><label for="kind">Category</label><select id="kind"><option value="exhibition">Exhibition</option><option value="screening">Screening</option><option value="selection">Festival selection</option><option value="award">Award</option><option value="endorsement">Endorsement</option></select></div><div class="ed-grid"><div class="ed-field"><label for="title_en">Title / name (EN)</label><input maxlength="300" id="title_en" ></div><div class="ed-field"><label for="title_ar">Title / name (AR)</label><input maxlength="300" id="title_ar" dir="rtl"></div></div><div class="ed-grid"><div class="ed-field"><label for="label_en">Institution / location / category (EN)</label><input maxlength="300" id="label_en" ></div><div class="ed-field"><label for="label_ar">Institution / location / category (AR)</label><input maxlength="300" id="label_ar" dir="rtl"></div></div><div class="ed-grid"><div class="ed-field"><label for="attribution_en">Credits / endorser and role (EN)</label><input maxlength="500" id="attribution_en" ></div><div class="ed-field"><label for="attribution_ar">Credits / endorser and role (AR)</label><input maxlength="500" id="attribution_ar" dir="rtl"></div></div><div class="ed-grid"><div class="ed-field"><label for="body_en">Description / endorsement text (EN)</label><textarea rows="5" maxlength="20000" id="body_en" ></textarea></div><div class="ed-field"><label for="body_ar">Description / endorsement text (AR)</label><textarea rows="5" maxlength="20000" id="body_ar" dir="rtl"></textarea></div></div><div class="ed-field"><label for="source_url">Public source URL (HTTPS, optional)</label><input id="source_url" type="url" maxlength="2048"></div><div class="ed-field"><label for="sort_order">Display order</label><input id="sort_order" type="number" min="0" max="100000" value="100"></div></div><div class="ed-field"><label for="precision">Date precision</label><select id="precision"><option value="exact">Exact date</option><option value="range">Date range</option><option value="year">Year only</option><option value="month">Month &amp; year</option><option value="pending">Pending confirmation</option></select></div><div class="ed-grid"><div class="ed-field" id="year-field" hidden><label for="event_year">Year</label><input type="number" id="event_year" min="1000" max="9999" step="1" placeholder="2025" inputmode="numeric"></div><div class="ed-field" id="month-field" hidden><label for="event_month">Month</label><select id="event_month"><option value="">Select month</option><option value="1">January</option><option value="2">February</option><option value="3">March</option><option value="4">April</option><option value="5">May</option><option value="6">June</option><option value="7">July</option><option value="8">August</option><option value="9">September</option><option value="10">October</option><option value="11">November</option><option value="12">December</option></select></div></div><div class="ed-grid"><div class="ed-field" id="start-field"><label for="event_date">Event / start date</label><input type="date" id="event_date"></div><div class="ed-field" id="end-field"><label for="end_date">End date</label><input type="date" id="end_date"></div></div><div class="ed-panel"><p class="ed-eyebrow">Public website preview</p><p id="preview" class="portfolio-preview"></p></div><div class="ed-actions"><button class="ed-button alt" type="submit" value="draft">Save draft</button><button class="ed-button" type="submit" value="published">Save &amp; publish</button><button class="ed-button ghost" type="button" id="remove" hidden>Delete</button></div></form></div></div></section></main><script type="module" src="portfolio-studio.js?v=2"></script></body></html>
